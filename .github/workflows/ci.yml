name: Python contract gates
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m py_compile contracts/*.py
      - name: Deterministic unit and simulated validator tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
